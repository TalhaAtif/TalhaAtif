<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Talha Atif. Software Engineering at McMaster, Full-Stack Developer Intern at EllisDon. US and Canadian citizen.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1128"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="80" y="118" font-size="24" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt; hello, I'm</text>
      <text x="78" y="186" font-size="72" font-weight="800" fill="url(#name)" letter-spacing="-1">Talha Atif</text>
      <text x="80" y="232" font-size="24" fill="#cbd5e1">Software Engineering @ McMaster  ·  Full-Stack Developer Intern @ EllisDon</text>
      <g transform="translate(830 52)">
        <rect width="300" height="50" rx="25" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.3"/>
        <text x="150" y="33" font-size="22" font-weight="600" fill="#f1f5f9" text-anchor="middle">US &amp; Canadian citizen</text>
      </g>
    </g>
  </g>
</svg>
